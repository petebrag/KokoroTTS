name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Checkout LFS objects
        run: git lfs pull

      - name: Verify LFS model downloaded
        run: |
          # A file that is still an LFS pointer is only ~130 bytes.
          size=$(stat -f%z Resources/kokoro-v1_0.safetensors)
          echo "kokoro-v1_0.safetensors: $size bytes"
          if [ "$size" -lt 300000000 ]; then
            echo "::error::Model is not downloaded (still an LFS pointer?)"
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Build application
        run: |
          xcodebuild -project KokoroTTS.xcodeproj \
            -scheme KokoroTTS \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Stamp build, ad-hoc sign and show bundle details
        run: |
          APP=build/Build/Products/Release/KokoroTTS.app
          # Shown in the About panel so the installed test build is identifiable.
          /usr/libexec/PlistBuddy -c "Add :KokoroBuildBranch string ${GITHUB_REF_NAME}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :KokoroBuildCommit string ${GITHUB_SHA::7}" "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSServices" "$APP/Contents/Info.plist"
          find "$APP" -name kokoro-v1_0.safetensors -exec ls -l {} \;

      - name: Zip application
        run: ditto -c -k --keepParent build/Build/Products/Release/KokoroTTS.app KokoroTTS.app.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KokoroTTS-${{ github.ref_name }}-${{ github.sha }}
          path: KokoroTTS.app.zip
          retention-days: 14

      - name: Create DMG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Create a temporary directory for DMG contents
          mkdir -p dmg-contents
          cp -R build/Build/Products/Release/KokoroTTS.app dmg-contents/
          ln -s /Applications dmg-contents/Applications

          # Create the DMG
          hdiutil create -volname "KokoroTTS" \
            -srcfolder dmg-contents \
            -ov -format UDZO \
            KokoroTTS.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KokoroTTS.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
